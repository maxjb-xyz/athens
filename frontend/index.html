<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#b8552b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Athens" />
  <title>Athens — learn by asking</title>
  <link rel="stylesheet" href="/fonts/fonts.css" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23b8552b'/%3E%3C/svg%3E" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
</head>
<body>
  <header class="topbar">
    <div class="brand" data-nav="home">
      <span class="brand-name">Athens</span>
    </div>
    <nav class="topnav">
      <button class="navlink" data-nav="home">Ask</button>
      <button class="navlink" data-nav="map">Map</button>
      <button class="navlink" data-nav="review">Review <span id="due-badge" class="badge" hidden></span></button>
      <button class="navlink" data-nav="progress">Progress</button>
      <button class="navlink" data-nav="settings">Settings</button>
    </nav>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabbar" id="tabbar">
    <button class="tab" data-nav="home"><span class="tab-ico">✎</span><span class="tab-label">Ask</span></button>
    <button class="tab" data-nav="map"><span class="tab-ico">◉</span><span class="tab-label">Map</span></button>
    <button class="tab" data-nav="review"><span class="tab-ico">↻</span><span class="tab-label">Review<span id="due-badge-m" class="badge" hidden></span></span></button>
    <button class="tab" data-nav="progress"><span class="tab-ico">▣</span><span class="tab-label">Progress</span></button>
    <button class="tab" data-nav="settings"><span class="tab-ico">⚙</span><span class="tab-label">Settings</span></button>
  </nav>

  <script src="/vendor/mermaid.min.js"></script>
  <script src="/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js"));
    }
  </script>
</body>
</html>
